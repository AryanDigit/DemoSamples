<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — Liora</title>
  <meta name="description" content="Review your Liora gift cart, add a gift message, and proceed to checkout." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div data-header></div>
  <main class="container">
    <div class="page-hero" style="margin:0 -1.25rem;padding-inline:1.25rem">
      <p class="eyebrow">Cart</p>
      <h1>Your gifts</h1>
    </div>
    <div class="cart-layout" id="cart-root"></div>
  </main>
  <div data-footer></div>
  <script src="js/products.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/app.js"></script>
  <script>
    function render() {
      const items = Liora.store.getCart();
      const root = document.getElementById("cart-root");
      if (!items.length) {
        root.innerHTML = `<div class="empty"><h2>Your cart is empty</h2><p class="muted">Find something lovely.</p><p style="margin-top:1rem"><a class="btn" href="shop.html">Shop gifts</a></p></div>`;
        return;
      }
      const sub = Liora.cartSubtotal(items);
      const ship = Liora.shippingFor(sub);
      root.innerHTML = `
        <div>
          ${items
            .map((item) => {
              const p = getProduct(item.id);
              return `<article class="cart-item" data-key="${encodeURIComponent(item.key)}">
                <img src="${p.images[0]}" alt="${p.name}" />
                <div>
                  <h3><a href="product.html?id=${p.id}">${p.name}</a></h3>
                  <p class="muted" style="font-size:0.88rem;margin:0.25rem 0">
                    ${item.engraving ? `Personalization: ${item.engraving} · ` : ""}
                    ${item.wrap ? "Gift wrap · " : ""}${item.card ? "Greeting card · " : ""}
                  </p>
                  <div class="qty-row">
                    <input type="number" min="1" value="${item.qty}" data-qty />
                    <button class="btn-ghost" type="button" data-remove>Remove</button>
                  </div>
                </div>
                <strong>${formatINR(item.unitPrice * item.qty)}</strong>
              </article>`;
            })
            .join("")}
          <div class="option-block" style="margin-top:1.5rem">
            <label for="cart-message">Gift message for the order</label>
            <textarea id="cart-message" placeholder="Optional note included with delivery">${localStorage.getItem("liora_gift_message") || ""}</textarea>
          </div>
        </div>
        <aside class="summary">
          <h2>Order summary</h2>
          <div class="summary-row"><span>Subtotal</span><span>${formatINR(sub)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${ship ? formatINR(ship) : "Free"}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatINR(sub + ship)}</span></div>
          <p class="muted" style="font-size:0.85rem;margin:0.75rem 0 1rem">${ship ? "Free shipping from ₹1,999" : "You’ve unlocked free shipping"}</p>
          <a class="btn btn-block" href="checkout.html">Checkout</a>
          <a class="btn btn-outline-dark btn-block" style="margin-top:0.55rem" href="shop.html">Continue shopping</a>
        </aside>`;

      document.getElementById("cart-message")?.addEventListener("input", (e) => {
        localStorage.setItem("liora_gift_message", e.target.value);
      });

      root.querySelectorAll(".cart-item").forEach((row) => {
        const key = decodeURIComponent(row.dataset.key);
        row.querySelector("[data-qty]").addEventListener("change", (e) => {
          const cart = Liora.store.getCart();
          const item = cart.find((i) => i.key === key);
          if (item) item.qty = Math.max(1, Number(e.target.value) || 1);
          Liora.store.setCart(cart);
          render();
        });
        row.querySelector("[data-remove]").addEventListener("click", () => {
          Liora.store.setCart(Liora.store.getCart().filter((i) => i.key !== key));
          render();
        });
      });
    }
    document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
