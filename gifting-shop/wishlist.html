<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist — Liora</title>
  <meta name="description" content="Saved gifts on your Liora wishlist." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div data-header></div>
  <main class="container" style="padding-bottom:4rem">
    <div class="page-hero" style="margin:0 -1.25rem 2rem;padding-inline:1.25rem">
      <p class="eyebrow">Saved</p>
      <h1>Wishlist</h1>
    </div>
    <div class="product-grid" id="wish-grid"></div>
  </main>
  <div data-footer></div>
  <script src="js/products.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const ids = Liora.store.getWish();
      const products = ids.map(getProduct).filter(Boolean);
      if (!products.length) {
        document.getElementById("wish-grid").innerHTML = `<div class="empty"><h2>No saved gifts yet</h2><p class="muted">Tap the heart on any product.</p><p style="margin-top:1rem"><a class="btn" href="shop.html">Browse</a></p></div>`;
        return;
      }
      Liora.renderProductGrid("#wish-grid", products);
    });
  </script>
</body>
</html>
