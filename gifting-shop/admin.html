<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Demo — Liora</title>
  <meta name="description" content="Demo admin view for Liora orders, wishlist inventory notes, and corporate inquiries (localStorage)." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div data-header></div>
  <main class="container" style="padding:2.5rem 0 5rem">
    <div class="page-hero" style="margin:0 -1.25rem 2rem;padding-inline:1.25rem">
      <p class="eyebrow">Demo admin</p>
      <h1>Orders &amp; inquiries</h1>
      <p class="muted">This lightweight panel reads demo data from the browser. Production would use Shopify/WooCommerce/headless CMS + secure auth.</p>
    </div>
    <div class="split" style="align-items:start">
      <div>
        <h2 class="display" style="font-size:1.75rem;margin-bottom:1rem">Recent orders</h2>
        <div id="orders" class="summary" style="position:static"></div>
      </div>
      <div>
        <h2 class="display" style="font-size:1.75rem;margin-bottom:1rem">Corporate inquiries</h2>
        <div id="corps" class="summary" style="position:static"></div>
        <h2 class="display" style="font-size:1.75rem;margin:2rem 0 1rem">Catalog snapshot</h2>
        <div id="inventory" class="summary" style="position:static"></div>
      </div>
    </div>
  </main>
  <div data-footer></div>
  <script src="js/products.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const orders = Liora.store.getOrders();
      document.getElementById("orders").innerHTML = orders.length
        ? orders
            .slice(0, 10)
            .map(
              (o) => `<div class="summary-row"><span>${o.id}<br><small class="muted">${o.customer?.name || ""} · ${o.deliverOn}</small></span><span>${formatINR(o.total)}<br><small>${o.status}</small></span></div>`
            )
            .join("")
        : "<p class="muted">No orders yet — place a demo checkout.</p>";

      const corps = JSON.parse(localStorage.getItem("liora_corp") || "[]");
      document.getElementById("corps").innerHTML = corps.length
        ? corps
            .slice()
            .reverse()
            .slice(0, 8)
            .map((c) => `<div class="summary-row"><span>${c.company}<br><small class="muted">${c.email}</small></span><span>×${c.qty}</span></div>`)
            .join("")
        : "<p class="muted">No corporate inquiries yet.</p>";

      document.getElementById("inventory").innerHTML = LIORA_PRODUCTS.map(
        (p) => `<div class="summary-row"><span>${p.name}</span><span>${p.stock} in stock</span></div>`
      ).join("");
    });
  </script>
</body>
</html>
