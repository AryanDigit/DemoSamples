<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ZorBill — Cloud Billing & Invoicing on the Zoho Ecosystem" />
  <title>ZorBill — Zoho Billing & Invoicing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/modules.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- Login / OAuth Gate -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card glass-card animate-fade-up">
      <div class="auth-brand">
        <div class="logo-mark" aria-hidden="true">
          <span class="material-icons-round">receipt_long</span>
        </div>
        <h1>ZorBill</h1>
        <p>Cloud Billing &amp; Invoicing · Powered by Zoho</p>
      </div>
      <form id="login-form" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@company.com" required value="admin@zorbill.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" required value="demo1234" />
        </div>
        <div class="form-group">
          <label for="login-role">Demo Role</label>
          <select id="login-role">
            <option value="super_admin">Super Admin</option>
            <option value="admin" selected>Admin</option>
            <option value="staff">Staff</option>
            <option value="accountant">Accountant</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">
          <span class="material-icons-round">login</span>
          Sign in with Zoho OAuth
        </button>
      </form>
      <p class="auth-hint">Demo mode uses sample data. Connect Zoho OAuth in Settings for live Books / Inventory / CRM sync.</p>
      <div class="auth-zoho">
        <span class="zoho-badge">Zoho Creator</span>
        <span class="zoho-badge">Zoho Books</span>
        <span class="zoho-badge">Zoho Inventory</span>
        <span class="zoho-badge">Zoho CRM</span>
      </div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app hidden" aria-hidden="true">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <div class="logo-mark sm">
          <span class="material-icons-round">receipt_long</span>
        </div>
        <div>
          <strong>ZorBill</strong>
          <small>Zoho Cloud ERP</small>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-footer">
        <button type="button" id="btn-theme" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
          <span class="material-icons-round">dark_mode</span>
        </button>
        <button type="button" id="btn-logout" class="icon-btn" title="Sign out" aria-label="Sign out">
          <span class="material-icons-round">logout</span>
        </button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" id="btn-menu" class="icon-btn mobile-only" aria-label="Open menu">
          <span class="material-icons-round">menu</span>
        </button>
        <div class="search-box">
          <span class="material-icons-round">search</span>
          <input id="global-search" type="search" placeholder="Search customers, invoices, products…" aria-label="Global search" />
          <kbd>/</kbd>
        </div>
        <div class="topbar-actions">
          <button type="button" id="btn-notifications" class="icon-btn badge-wrap" aria-label="Notifications">
            <span class="material-icons-round">notifications</span>
            <span class="badge-dot" id="notif-count">3</span>
          </button>
          <button type="button" class="btn btn-primary btn-sm" id="btn-quick-invoice">
            <span class="material-icons-round">add</span>
            New Invoice
          </button>
          <div class="user-chip" id="user-chip">
            <div class="avatar" id="user-avatar">A</div>
            <div>
              <strong id="user-name">Admin</strong>
              <small id="user-role">Admin</small>
            </div>
          </div>
        </div>
      </header>

      <main id="content" class="content" role="main"></main>
    </div>

    <!-- Notifications panel -->
    <aside id="notif-panel" class="notif-panel" aria-hidden="true">
      <div class="notif-header">
        <h3>Notifications</h3>
        <button type="button" id="btn-close-notif" class="icon-btn" aria-label="Close">
          <span class="material-icons-round">close</span>
        </button>
      </div>
      <div id="notif-list" class="notif-list"></div>
    </aside>
  </div>

  <!-- Modal host -->
  <div id="modal-root" class="modal-root" aria-hidden="true"></div>

  <!-- Toast host -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- Overlay for mobile sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="sample-data/demo-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/gst.js"></script>
  <script src="assets/js/modules/dashboard.js"></script>
  <script src="assets/js/modules/customers.js"></script>
  <script src="assets/js/modules/products.js"></script>
  <script src="assets/js/modules/suppliers.js"></script>
  <script src="assets/js/modules/purchases.js"></script>
  <script src="assets/js/modules/inventory.js"></script>
  <script src="assets/js/modules/expenses.js"></script>
  <script src="assets/js/modules/quotations.js"></script>
  <script src="assets/js/modules/billing.js"></script>
  <script src="assets/js/modules/payments.js"></script>
  <script src="assets/js/modules/gst-module.js"></script>
  <script src="assets/js/modules/reports.js"></script>
  <script src="assets/js/modules/notifications.js"></script>
  <script src="assets/js/modules/settings.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
